name: Build Windows 7 Legacy Installer (Node 6)

on:
  workflow_dispatch:
  push:
    paths:
      - "local-agent-installer/**"
      - ".github/workflows/build-local-agent-installer-win7-legacy.yml"

jobs:
  build-windows7-legacy-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24 for build tools
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: local-agent-installer/package.json

      - name: Prepare staging folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:GITHUB_WORKSPACE 'local-agent-installer\win7-staging'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item 'local-agent-installer\server.js' $staging -Force
          Copy-Item 'local-agent-installer\package.json' $staging -Force
          Copy-Item 'local-agent-installer\launch-agent.vbs' $staging -Force

      - name: Install application dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location "$env:GITHUB_WORKSPACE\local-agent-installer\win7-staging"
          npm install --omit=dev
          Pop-Location

      - name: Download Node.js 6.17.1 x64 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://nodejs.org/dist/v6.17.1/node-v6.17.1-win-x64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'node-v6.17.1-win-x64.zip'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'node6'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
          if (Test-Path $runtimeRoot) { Remove-Item $runtimeRoot -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $runtimeRoot -Force
          $nodeExe = Get-ChildItem $runtimeRoot -Recurse -Filter node.exe | Select-Object -First 1
          if (-not $nodeExe) { throw 'Node.js 6.17.1 node.exe was not found after extraction.' }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\local-agent-installer\win7-staging\runtime" | Out-Null
          Copy-Item $nodeExe.FullName "$env:GITHUB_WORKSPACE\local-agent-installer\win7-staging\runtime\node.exe" -Force

      - name: Validate legacy source with Node 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = "$env:GITHUB_WORKSPACE\local-agent-installer\win7-staging"
          & "$staging\runtime\node.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Node.js 6 runtime failed to start on the build runner.' }
          & "$staging\runtime\node.exe" --check "$staging\server.js"
          if ($LASTEXITCODE -ne 0) { throw 'Legacy server.js failed Node.js 6 syntax validation.' }
          Push-Location $staging
          & .\runtime\node.exe -e "var x=require('xlsx-js-style'); console.log('xlsx-js-style loaded:', require('xlsx-js-style/package.json').version);"
          if ($LASTEXITCODE -ne 0) { throw 'xlsx-js-style could not be loaded by Node.js 6.' }
          Pop-Location

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y

      - name: Compile Windows 7 Legacy installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iss = "$env:GITHUB_WORKSPACE\local-agent-installer\win7-installer.iss"
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' $iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $expected = Join-Path $env:GITHUB_WORKSPACE 'local-agent-installer\output\ECOM-ICS-Local-Agent-Windows7-Legacy-Setup.exe'
          $expectedDir = Split-Path $expected -Parent
          New-Item -ItemType Directory -Force -Path $expectedDir | Out-Null
          $matches = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter 'ECOM-ICS-Local-Agent-Windows7-Legacy-Setup.exe' | Where-Object { $_.FullName -ne $expected }
          if ($matches.Count -eq 0) { throw 'Installer EXE was not found after Inno Setup compilation.' }
          Copy-Item $matches[0].FullName $expected -Force
          Write-Host "Installer staged for artifact upload: $expected"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ECOM-ICS-Local-Agent-Windows7-Legacy-Setup
          path: local-agent-installer/output/ECOM-ICS-Local-Agent-Windows7-Legacy-Setup.exe
          if-no-files-found: error
