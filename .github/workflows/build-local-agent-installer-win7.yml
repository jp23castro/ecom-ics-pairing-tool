name: Build Windows 7 Legacy Installer (Node 6)

on:
  workflow_dispatch:
  push:
    paths:
      - "local-agent-installer/**"
      - ".github/workflows/build-local-agent-installer-win7-legacy.yml"

jobs:
  build-windows7-legacy-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24 for build tools
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: local-agent-installer/package.json

      - name: Prepare staging folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = "$env:GITHUB_WORKSPACE\local-agent-installer\win7-staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\local-agent-installer\server.js" "$staging\server.js" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\local-agent-installer\package.json" "$staging\package.json" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\local-agent-installer\launch-agent.vbs" "$staging\launch-agent.vbs" -Force

      - name: Verify Node 6 compatible server source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Get-Content "$env:GITHUB_WORKSPACE\local-agent-installer\server.js" -Raw
          if ($server -match '\|\|=|&&=|\?\?=') {
            throw 'server.js still contains logical assignment syntax that Node 6 cannot parse.'
          }
          Write-Host 'Node 6-compatible server source check passed.'

      - name: Install application dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location "$env:GITHUB_WORKSPACE\local-agent-installer\win7-staging"
          npm install --omit=dev
          Pop-Location

      - name: Download exact official Node.js 6.17.1 x64 binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://nodejs.org/dist/v6.17.1/win-x64/node.exe'
          $nodeExe = Join-Path $env:RUNNER_TEMP 'node-v6.17.1-win-x64.exe'
          $expectedSha256 = '6639e047318e21dc1c5077325d8be24a9ca7462a53c202bb6c8c7ac08e5bdd59'

          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $nodeExe

          $actualSha256 = (Get-FileHash $nodeExe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Downloaded Node SHA256: $actualSha256"

          if ($actualSha256 -ne $expectedSha256) {
            throw "Node.js 6.17.1 SHA256 mismatch. Expected $expectedSha256 but got $actualSha256."
          }

          $runtime = "$env:GITHUB_WORKSPACE\local-agent-installer\win7-staging\runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item $nodeExe "$runtime\node.exe" -Force

          $stagedSha256 = (Get-FileHash "$runtime\node.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($stagedSha256 -ne $expectedSha256) {
            throw 'Staged Node.js runtime hash does not match the official Node.js 6.17.1 x64 binary.'
          }

      - name: Validate exact Node 6 runtime and application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = "$env:GITHUB_WORKSPACE\local-agent-installer\win7-staging"
          $node = "$staging\runtime\node.exe"

          & $node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node.js 6 runtime failed to start on the build runner.' }

          & $node --check "$staging\server.js"
          if ($LASTEXITCODE -ne 0) { throw 'server.js failed Node.js 6 syntax validation.' }

          Push-Location $staging
          & $node -e "require('xlsx-js-style'); console.log('xlsx-js-style loaded successfully');"
          if ($LASTEXITCODE -ne 0) { throw 'xlsx-js-style could not be loaded by Node.js 6.' }
          Pop-Location

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y

      - name: Compile Windows 7 Legacy installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iss = "$env:GITHUB_WORKSPACE\local-agent-installer\win7-installer.iss"
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' $iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

          $outputDir = "$env:GITHUB_WORKSPACE\local-agent-installer\output"
          $final = "$outputDir\ECOM-ICS-Local-Agent-Windows7-Legacy-Setup.exe"

          if (-not (Test-Path $final)) {
            throw "Expected installer was not created: $final"
          }

          Write-Host "Installer created: $final"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ECOM-ICS-Local-Agent-Windows7-Legacy-Setup
          path: local-agent-installer/output/ECOM-ICS-Local-Agent-Windows7-Legacy-Setup.exe
          if-no-files-found: error
